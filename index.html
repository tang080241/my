<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>嫂嫂模拟器 v3.2.1</title>
  <style>
    :root {
      --phone-w:390px;--phone-h:760px;--phone-radius:28px;--phone-bg:#0a0a0d;--phone-border:#1e1e24;
      --phone-shadow:0 0 0 2px #252530,0 0 0 6px #0f0f14,0 0 0 8px #252530,0 20px 60px rgba(0,0,0,0.7);
      --notch-w:100px;--notch-h:24px;--notch-bg:#0f0f14;--screen-bg:#0d0d12;--status-h:38px;--status-bg:#08080c;
      --status-text:#b0b0b8;--status-time:12px;--status-icon:11px;--icon-size:56px;--icon-radius:14px;
      --icon-bg:#1a1a24;--icon-label:10px;--icon-label-color:#9999a6;--dock-bg:rgba(255,255,255,0.03);
      --dock-h:64px;--text-primary:#e8e8f0;--text-secondary:#a0a0b0;--text-tertiary:#6a6a78;
      --accent:#c9a050;--accent-dim:#7a5f30;--danger:#d94040;--success:#3aac5c;--love:#e85d75;
      --border:#1e1e2a;--surface:#15151c;--bubble-mine:#1a3a2a;--bubble-theirs:#1f1f2a;
      --bubble-radius:16px;--bar-bg:rgba(255,255,255,0.06);
      --bar-opinion:#c9a050;--bar-relationship:#e85d75;--bar-rival:#d94040;--bar-exposure:#ff8c42;
      --bar-emotion:#6b9fff;--font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      --font-mono:"SF Mono","Menlo","Consolas","PingFang SC",monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#050508;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;font-family:var(--font-ui);overflow:hidden}
    .phone-container{position:relative;width:var(--phone-w);height:var(--phone-h);border-radius:var(--phone-radius);background:var(--phone-bg);box-shadow:var(--phone-shadow);overflow:hidden;flex-shrink:0}
    .phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--notch-w);height:var(--notch-h);background:var(--notch-bg);border-radius:0 0 16px 16px;z-index:20}
    .phone-screen{width:100%;height:100%;background:var(--screen-bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
    .page{display:none;flex:1;flex-direction:column;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--accent-dim) transparent}
    .page.active{display:flex}
    .page::-webkit-scrollbar{width:3px}.page::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:3px}
    .status-bar{height:var(--status-h);background:var(--status-bg);display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:var(--status-text);font-size:var(--status-icon);flex-shrink:0;border-bottom:1px solid var(--border)}
    .status-bar .time{font-size:var(--status-time);font-weight:600;color:var(--text-primary)}
    .title-bar{height:48px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--text-primary);border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
    .title-bar .back-btn{position:absolute;left:12px;background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer}
    .content-area{flex:1;padding:16px;overflow-y:auto}
    button{font-family:var(--font-ui);cursor:pointer;transition:all 0.15s}
    button:active{transform:scale(0.95)}
    .btn-primary{width:100%;height:48px;border-radius:24px;background:var(--accent);border:none;color:#fff;font-size:15px;font-weight:700}
    .btn-secondary{width:100%;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);font-size:14px}
    .btn-sm{padding:6px 12px;border-radius:14px;font-size:11px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}
    input,select,textarea{width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);padding:0 14px;font-size:14px;font-family:var(--font-ui);outline:none}
    input,select{height:42px}textarea{height:80px;padding:10px 14px;resize:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    label{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:4px;display:block;letter-spacing:1px}
    .section-title{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:2px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
    .progress-bar{height:6px;background:var(--bar-bg);border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
    .chat-bubble{max-width:75%;padding:10px 14px;border-radius:var(--bubble-radius);font-size:13px;line-height:1.5;word-break:break-word;margin:4px 0}
    .chat-bubble.mine{background:var(--bubble-mine);border-bottom-right-radius:4px;align-self:flex-end;margin-left:auto}
    .chat-bubble.theirs{background:var(--bubble-theirs);border-bottom-left-radius:4px;align-self:flex-start}
    .chat-row{display:flex;align-items:flex-start;gap:8px;margin:6px 0}
    .chat-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .chat-avatar-lg{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;margin:2px}
    .tag-red{background:#3a1010;color:var(--danger)}.tag-green{background:#103a10;color:var(--success)}
    .tag-orange{background:#3a2010;color:#ff8c42}.tag-gold{background:#2a2010;color:var(--accent)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .grid-7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all 0.15s;margin:6px 0}
    .card:active{transform:scale(0.96)}
    .icon-app{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform 0.15s}
    .icon-app:active{transform:scale(0.9)}
    .icon-app .icon-square{width:var(--icon-size);height:var(--icon-size);border-radius:var(--icon-radius);background:var(--icon-bg);display:flex;align-items:center;justify-content:center;font-size:24px}
    .icon-app .icon-label{font-size:var(--icon-label);color:var(--icon-label-color);margin-top:6px;text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dock{height:var(--dock-h);background:var(--dock-bg);display:flex;justify-content:space-around;align-items:center;padding:0 30px;border-radius:20px 20px 0 0;flex-shrink:0}
    .dock span{font-size:22px;color:#666;cursor:pointer}
    .dock span.active{color:var(--accent)}
    .tab-bar{display:flex;height:44px;border-bottom:1px solid var(--border);flex-shrink:0}
    .tab-bar button{flex:1;background:none;border:none;color:var(--text-tertiary);font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:all 0.2s}
    .tab-bar button.active{color:var(--accent);border-bottom-color:var(--accent)}
    .modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:flex-end;justify-content:center;z-index:25;border-radius:28px}
    .modal-bottom{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;text-align:center;animation:slideUp 0.3s ease}
    .modal-overlay-center{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:25;border-radius:28px}
    .pwd-box{width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-primary);transition:all 0.2s}
    .pwd-box.filled{background:var(--accent-dim);border-color:var(--accent)}
    .threat-ring{width:80px;height:80px;border-radius:50%;border:6px solid;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;font-weight:700}
    .threat-ring.green{border-color:var(--success);color:var(--success)}.threat-ring.yellow{border-color:#c9c050;color:#c9c050}
    .threat-ring.orange{border-color:#ff8c42;color:#ff8c42}.threat-ring.red{border-color:var(--danger);color:var(--danger)}
    .filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
    .filter-bar button{padding:6px 12px;border-radius:14px;font-size:11px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}
    .filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .time-divider{text-align:center;font-size:10px;color:#555;margin:8px 0}
    .unread-dot{width:16px;height:16px;border-radius:50%;background:var(--danger);position:absolute;top:4px;right:4px;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center}
    .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:typingBounce 0.6s infinite}
    .typing-dot:nth-child(2){animation-delay:0.2s}.typing-dot:nth-child(3){animation-delay:0.4s}
    .word-cloud{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .word-cloud span{padding:4px 10px;border-radius:12px;font-size:11px;background:var(--surface);border:1px solid var(--border)}
    .word-cloud span.hot{background:var(--danger);color:#fff;border:none;font-weight:700}
    .word-cloud span.warm{color:#ff8c42;border-color:#ff8c42}
    .alert-list{padding:0}
    .alert-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
    .alert-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    @keyframes slideIn{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    @keyframes typingBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .notification-bar{position:absolute;top:calc(var(--status-h) + 4px);left:8px;right:8px;background:#1a1a28;border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:15;animation:slideIn 0.3s ease}
    .shake{animation:shake 0.5s ease}
  </style>
</head>
<body>
<div class="phone-container" id="phoneContainer"><div class="phone-notch"></div><div class="phone-screen" id="phoneScreen"></div></div>
<script>
(()=>{
const G={
  countdownHours:48,blackmailAmount:2000,phase2Exposure:30,phase3Exposure:50,
  diceCriticalSuccess:5,diceSuccess:35,diceFail:40,diceCriticalFail:20,
  negotiateRate:40,policeRate:30,delayRate:50,payRate:70,
  emotionRecover:{chatWithHim:5,bestie:3,drama:2,dessert:4,sport:3},
  stalkerBaseFrequency:1,stalkerExposureMultiplier:1.5,
  initialPublicOpinion:50,initialRelationship:70,initialRivalAttention:0,initialExposure:0,initialEmotion:75,
  identityModifiers:{A:{opinion:0,diff:'★★',desc:'广告公司AE',fanGroup:'none'},B:{opinion:2,diff:'★★☆',desc:'心理学研究生',fanGroup:'none'},C:{opinion:-2,diff:'★★★',desc:'咖啡店老板',fanGroup:'none'},D:{opinion:-5,diff:'★★★★',desc:'十八线演员',fanGroup:'small'},E:{opinion:-10,diff:'★★★★★',desc:'对家公司新人',fanGroup:'medium'},F:{opinion:3,diff:'★★★☆',desc:'住院医师',fanGroup:'none'}},
  fanGroupConfig:{none:{online:0,onlineMin:0,onlineMax:0,growthRate:0,hasGroup:false},small:{online:80,onlineMin:30,onlineMax:500,growthRate:5,hasGroup:true},medium:{online:300,onlineMin:100,onlineMax:2000,growthRate:15,hasGroup:true}},
  maleFanGroup:{online:1289,onlineMin:1000,onlineMax:50000,growthRate:100},
  supertopicPostMinInterval:60000,supertopicPostMaxInterval:300000,supertopicPostMinCount:1,supertopicPostMaxCount:3,
  hotSearchRefreshInterval:1800000,fanGroupGrowthInterval:3600000,maleActiveMessageInterval:2400000,
  defaultMaleLead:{name:'陆砚',age:27,job:'顶流男演员'},
  dlcList:[{id:'dlc1',name:'🤰意外怀孕',stars:'★★★★★',locked:true},{id:'dlc2',name:'💣对家之女',stars:'★★★★',locked:true},{id:'dlc3',name:'📋合约情侣',stars:'★★★★',locked:true},{id:'dlc4',name:'👻前任归来',stars:'★★★★',locked:false},{id:'dlc5',name:'🕯️退圈倒计时',stars:'★★★',locked:false},{id:'dlc6',name:'🎭双面人生',stars:'★★★★',locked:true}],
  achievementList:[{id:'ach1',name:'人间清醒',tier:'🥉'},{id:'ach2',name:'键盘侠克星',tier:'🥉'},{id:'ach3',name:'首次热搜',tier:'🥉'},{id:'ach4',name:'偷看手机',tier:'🥉'},{id:'ach5',name:'潜水高手',tier:'🥉'},{id:'ach6',name:'妈妈的认可',tier:'🥈'},{id:'ach7',name:'绿茶终结者',tier:'🥈'},{id:'ach8',name:'反侦察高手',tier:'🥈'},{id:'ach9',name:'发现小号',tier:'🥈'},{id:'ach10',name:'节奏大师',tier:'🥈'},{id:'ach11',name:'嫂学满分',tier:'🥇'},{id:'ach12',name:'世纪官宣',tier:'🥇'},{id:'ach13',name:'逆风翻盘',tier:'🥇'},{id:'ach14',name:'铜墙铁壁',tier:'🥇'},{id:'ach15',name:'退圈告白',tier:'💎'},{id:'ach16',name:'全员助攻',tier:'💎'}],
  npcReplies:{'赵姐':['在谈。你别管'],'小周':['嫂子救救我！！'],'阿Ken':['宝贝你最美💅'],'林语晴':['你是他的朋友？'],'孟瑶':['他没提过我？'],'妈妈':['小陆来不来？'],'娱八哥':['2000万。'],'物业保安':['收到。']},
};
const State={
  phase:1,publicOpinion:G.initialPublicOpinion,relationship:G.initialRelationship,rivalAttention:G.initialRivalAttention,exposure:G.initialExposure,emotion:G.initialEmotion,
  countdown:null,countdownTimer:null,maleLead:{...G.defaultMaleLead},myIdentity:null,myFanGroupType:'none',myFanGroupOnline:0,maleFanGroupOnline:G.maleFanGroup.online,
  currentPage:'splash',myFanchatMessages:[],maleFanchatMessages:[],supertopicPosts:[],hotsearchList:[],prevHotsearchList:[],stalkerEvents:[],stalkerMessages:[],
  chatHistory:{maleLead:[],zhao:[],xiaoZhou:[],aKen:[],lin:[],meng:[],mom:[],bestie:[]},
  hisMemos:['她怕冷，空调不要低于26度','她不吃香菜','下次吵架先道歉','娱八哥要2000万','戒指尺寸：9号'],
  hisSecretMemo:'退圈声明草稿：\n我想光明正大地牵着她的手走在街上。\n陆砚。',
  hisSupertopicPosts:[],notificationQueue:[],timers:{},dlcInstalled:{},achievements:{},hisWrongAttempts:0,hisLockUntil:null,
  stalkerCounters:{phone:0,message:0},saveSlots:[null,null,null],
  safetyCooldowns:{换号:0,搬家:0},autoSave:true,difficulty:'普通',rhythm:'标准',
  anniversaryDate:new Date(Date.now()+3*86400000),lastAnniversaryCheck:null,
  fanPostCount24h:0,lastFanPostReset:Date.now(),wechatUnread:{maleLead:0,zhao:0,aKen:0,xiaoZhou:0,mom:0},
  hisPhonePassword:'1024',maleActiveMessageCooldown:0,emotionDiary:[],callTimer:null,
  _hisPwdInput:'',_modalCount:0,
};
G.achievementList.forEach(a=>State.achievements[a.id]=false);

const $=id=>document.getElementById(id);const phoneScreen=$('phoneScreen');
function renderPage(pageId,html){let el=$(pageId);if(!el){el=document.createElement('div');el.id=pageId;el.className='page';phoneScreen.appendChild(el);}el.innerHTML=html;return el;}
function navigateTo(pageId){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=$(pageId);if(p){p.classList.add('active');State.currentPage=pageId;}}
function updateStat(key,delta){State[key]=Math.max(0,Math.min(100,State[key]+delta));updateAllUI();if(State.autoSave)saveGame();checkEndings();}
function updateAllUI(){document.querySelectorAll('[data-stat]').forEach(el=>{const key=el.dataset.stat;if(State[key]!==undefined){const fill=el.querySelector('.progress-fill');const val=el.querySelector('.stat-value');if(fill)fill.style.width=State[key]+'%';if(val)val.textContent=State[key]+'/100';}});}
function saveGame(){try{const d=JSON.parse(JSON.stringify(State));delete d.countdownTimer;delete d.timers;delete d.callTimer;localStorage.setItem('save_autosave',JSON.stringify(d));}catch(e){}}
function loadGame(slot){try{const key=slot?'save_'+slot:'save_autosave';const d=localStorage.getItem(key);if(d){const s=JSON.parse(d);Object.assign(State,s);State.countdownTimer=null;State.timers={};State.callTimer=null;if(State.countdown&&State.phase===3)startCountdown();updateAllUI();startAllTimers();return true;}}catch(e){}return false;}
function rollDice(){return Math.floor(Math.random()*100)+1;}
function checkDiceResult(r){if(r<=G.diceCriticalSuccess)return'criticalSuccess';if(r<=G.diceCriticalSuccess+G.diceSuccess)return'success';if(r<=G.diceCriticalSuccess+G.diceSuccess+G.diceFail)return'fail';return'criticalFail';}
function fmtTime(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function fmtCountdown(){if(!State.countdown)return'--:--:--';const h=Math.floor(State.countdown/3600);const m=Math.floor((State.countdown%3600)/60);const s=State.countdown%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function fmtCooldown(until){if(!until||Date.now()>=until)return'';const m=Math.floor((until-Date.now())/60000);return m>60?`${Math.floor(m/60)}h`:m>0?`${m}m`:'';}
function checkPhase(){if(State.phase===1&&State.exposure>=G.phase2Exposure){State.phase=2;pushNotification('⚠️危机逼近','赵姐让你少出门','wechat');}if(State.phase===2&&State.exposure>=G.phase3Exposure&&!State.countdown){State.phase=3;startCountdown();pushNotification('🚨48小时倒计时','娱八哥有照片，2000万','paparazzi');}}
function startCountdown(){State.countdown=G.countdownHours*3600;if(State.countdownTimer)clearInterval(State.countdownTimer);State.countdownTimer=setInterval(()=>{if(State.countdown>0){State.countdown--;const cd=$('countdown-display');if(cd)cd.textContent=fmtCountdown();}if(State.countdown<=0){clearInterval(State.countdownTimer);State.countdownTimer=null;updateStat('publicOpinion',-30);pushNotification('⏰倒计时归零','照片可能曝光','paparazzi');}},1000);}
function pushNotification(title,content,targetPage){State.notificationQueue.push({title,content,targetPage});showNotification();}
function showNotification(){if(!State.notificationQueue.length)return;const n=State.notificationQueue[0];const ex=document.querySelector('.notification-bar');if(ex)ex.remove();const bar=document.createElement('div');bar.className='notification-bar';bar.innerHTML=`<span style="font-size:24px;">📱</span><div style="flex:1;"><b>${n.title}</b><div style="font-size:11px;">${n.content}</div></div><button class="btn-sm notif-ignore">忽略</button><button class="btn-sm notif-view" style="background:var(--accent);color:#fff;border:none;">查看</button>`;phoneScreen.appendChild(bar);bar.querySelector('.notif-ignore').onclick=()=>{State.notificationQueue.shift();bar.remove();};bar.querySelector('.notif-view').onclick=()=>{const t=n.targetPage;State.notificationQueue.shift();bar.remove();if(t==='wechat')renderWechat();else if(t==='paparazzi')renderPaparazzi();};setTimeout(()=>{if(bar.parentNode)bar.remove();State.notificationQueue.shift();},4000);}
function achieve(id){if(!State.achievements[id]){State.achievements[id]=true;const a=G.achievementList.find(x=>x.id===id);if(a)pushNotification(`🏆${a.tier}成就解锁`,a.name,'');}}
function getNpcReply(npc){const r=G.npcReplies[npc];return r?r[Math.floor(Math.random()*r.length)]:'你好';}
function clearAllTimers(){Object.values(State.timers).forEach(clearInterval);State.timers={};if(State.callTimer){clearInterval(State.callTimer);State.callTimer=null;}}
function resumeAllTimers(){clearAllTimers();startAllTimers();}
function checkEndings(){if(State.publicOpinion>80&&State.relationship>90)achieve('ach12');}
function refreshHotSearch(){const base=State.phase===1?['#星光大赏#','#陆砚西装#']:State.phase===2?['#恋情猜测#','#车库神秘女子#']:['#恋情曝光#爆','#车库牵手照#沸'];State.prevHotsearchList=[...State.hotsearchList];State.hotsearchList=[...base];while(State.hotsearchList.length<50)State.hotsearchList.push(`#话题${State.hotsearchList.length}#`);}
function getHotChange(i){if(!State.prevHotsearchList.length)return'';const prev=State.prevHotsearchList[i];const curr=State.hotsearchList[i];if(!prev||prev===curr)return'';const pi=State.prevHotsearchList.indexOf(curr);if(pi<0)return'<span style="color:var(--success);font-size:9px;">↑新</span>';if(pi>i)return`<span style="color:var(--success);font-size:9px;">↑${pi-i}</span>`;return`<span style="color:var(--danger);font-size:9px;">↓${i-pi}</span>`;}
function generateMaleReply(msg){const isNight=new Date().getHours()>=22;if(msg.includes('想'))return'烦不烦。……我也想你行了吧';if(isNight&&Math.random()<0.3)return'睡不着？……想着你就不怕了';return['嗯。','知道了。'][Math.floor(Math.random()*2)];}

function showIncomingCall(name,suspicious=false){if(State.callTimer){clearInterval(State.callTimer);State.callTimer=null;}const overlay=showModal(`<div style="text-align:center;color:var(--text-primary);"><div style="font-size:64px;">${suspicious?'🚨':'📞'}</div><div style="font-size:22px;font-weight:700;">${name}</div>${suspicious?`<div style="color:var(--danger);">私生粉（第${State.stalkerCounters.phone}次）</div>`:''}<div class="pulse" id="callPulse_${State._modalCount}">呼叫中...</div><div id="callTimer_${State._modalCount}" style="display:none;font-family:var(--font-mono);font-size:16px;margin:8px;">00:00</div><div style="display:flex;gap:24px;margin-top:20px;justify-content:center;"><button class="btn-secondary" style="padding:12px 24px;border-radius:50%;color:var(--danger);border-color:var(--danger);" id="rejectCall_${State._modalCount}">📵拒绝</button><button class="btn-primary" style="padding:12px 24px;border-radius:50%;background:var(--success);" id="acceptCall_${State._modalCount}">📞接听</button></div><button class="btn-sm" id="hangupCall_${State._modalCount}" style="display:none;margin-top:12px;color:var(--danger);">挂断</button></div>`);let callSeconds=0;const mid=State._modalCount;overlay.querySelector(`#rejectCall_${mid}`).onclick=()=>{if(State.callTimer)clearInterval(State.callTimer);overlay.remove();};overlay.querySelector(`#acceptCall_${mid}`).onclick=()=>{overlay.querySelector(`#rejectCall_${mid}`).style.display='none';overlay.querySelector(`#acceptCall_${mid}`).style.display='none';overlay.querySelector(`#hangupCall_${mid}`).style.display='inline-block';overlay.querySelector(`#callPulse_${mid}`).style.display='none';const td=overlay.querySelector(`#callTimer_${mid}`);if(td)td.style.display='block';State.callTimer=setInterval(()=>{callSeconds++;const m=Math.floor(callSeconds/60);const s=callSeconds%60;if(td)td.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);if(name===State.maleLead.name){updateStat('relationship',5);updateStat('emotion',10);}if(suspicious){updateStat('exposure',8);State.stalkerCounters.phone++;}};overlay.querySelector(`#hangupCall_${mid}`).onclick=()=>{if(State.callTimer)clearInterval(State.callTimer);overlay.remove();};}

// ==================== 其余App ====================
function renderPaparazzi(){const rc=State.phase>=3?'red':State.phase>=2?'orange':'yellow';const re=State.phase>=3?'🔴':State.phase>=2?'🟠':'🟡';renderPage('page-app-paparazzi',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="papBack">← 狗仔</button></div><div class="content-area"><div class="threat-ring ${rc}">${re}</div><p style="text-align:center;">威胁等级</p><div class="chat-bubble theirs highlight">📸车库牵手照</div><p>💰${G.blackmailAmount}万 | ⏰<span id="countdown-display" style="font-family:var(--font-mono);">${fmtCountdown()}</span></p>${State.phase===3?`<button class="btn-secondary" onclick="window._nego()">🤝谈判</button><button class="btn-secondary" onclick="window._police()">🚔报警</button><button class="btn-secondary" onclick="window._stall()">⏳拖延</button><button class="btn-primary" onclick="window._pay()">💰付钱</button>`:'<p style="color:var(--text-tertiary);">阶段三解锁</p>'}</div>`);navigateTo('page-app-paparazzi');$('papBack').onclick=renderHome;}
window._nego=()=>{const r=checkDiceResult(rollDice());if(r==='criticalSuccess'){G.blackmailAmount=500;alert('大成功！500万');}else if(r==='success'){G.blackmailAmount=1000;alert('成功！1000万');}else alert('失败！');renderPaparazzi();};
window._police=()=>{const r=checkDiceResult(rollDice());if(r==='criticalSuccess'){State.countdown=0;alert('大成功！');achieve('ach8');}else alert('部分成功');renderPaparazzi();};
window._stall=()=>{State.countdown=(State.countdown||0)+86400;alert('+24h');renderPaparazzi();};
window._pay=()=>{if(confirm('2000万？')){State.countdown=0;alert('已付');renderPaparazzi();}};
function renderMonitor(){renderPage('page-app-monitor',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="monBack">← 舆情</button></div><div class="content-area">${[['💚舆论','publicOpinion','var(--bar-opinion)'],['❤️关系','relationship','var(--bar-relationship)'],['⚠️对家','rivalAttention','var(--bar-rival)'],['👁️暴露','exposure','var(--bar-exposure)'],['💙情绪','emotion','var(--bar-emotion)']].map(([l,k,c])=>`<p>${l} <span class="stat-value">${State[k]}/100</span></p><div class="progress-bar" data-stat="${k}"><div class="progress-fill" style="width:${State[k]}%;background:${c};"></div></div>`).join('')}<div class="word-cloud"><span class="hot">恋情</span><span class="warm">曝光</span><span>粉丝</span></div><div class="alert-list"><div class="alert-item"><span class="alert-dot"></span>娱八哥预告</div></div></div>`);navigateTo('page-app-monitor');$('monBack').onclick=renderHome;}
function renderSchedule(){renderPage('page-app-schedule',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="schBack">← 行程</button></div><div class="content-area"><div class="filter-bar"><button class="active" onclick="document.querySelectorAll('.schedule-item').forEach(e=>e.style.display='block')">全部</button><button onclick="document.querySelectorAll('.schedule-item').forEach(e=>e.style.display=e.dataset.type==='拍摄'?'block':'none')">拍摄</button></div><div class="chat-bubble theirs schedule-item" data-type="拍摄">🎬新剧拍摄·横店 <span class="tag tag-green">🟢</span></div><div class="chat-bubble theirs schedule-item" data-type="综艺">🎤综艺·北京 <span class="tag">🟡</span></div><button class="btn-primary" style="margin-top:8px;" onclick="updateStat('exposure',5);updateStat('relationship',5);alert('已设')">📝悄悄见面</button></div>`);navigateTo('page-app-schedule');$('schBack').onclick=renderHome;}
function renderStalker(){renderPage('page-app-stalker',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="stkBack">← 骚扰</button></div><div class="content-area"><div class="tab-bar"><button class="active" data-stab="log">日志</button><button data-stab="safety">措施</button></div><div id="stalkerContent"></div></div>`);navigateTo('page-app-stalker');$('stkBack').onclick=renderHome;document.querySelectorAll('.tab-bar button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.tab-bar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderStalkerTab(b.dataset.stab);};});renderStalkerTab('log');}
function renderStalkerTab(tab){const c=$('stalkerContent');if(!c)return;if(tab==='log'){c.innerHTML=State.stalkerEvents.slice(-10).reverse().map((e,i)=>`<div class="card"><b>${e.type}</b> <span class="tag tag-${e.level==='🔴'?'red':'orange'}">${e.level}</span><br><span style="font-size:10px;">${e.time}</span><br><span id="sd_${i}" style="display:none;">${e.desc||'详情'}</span><br><button class="btn-sm" onclick="const d=document.getElementById('sd_${i}');d.style.display=d.style.display==='none'?'block':'none';">查看详情</button></div>`).join('')||'<p>暂无</p>';}else{c.innerHTML=`<button class="btn-secondary" onclick="State.safetyCooldowns.换号=Date.now()+7*86400000;updateStat('exposure',-10);renderStalkerTab('safety');" ${State.safetyCooldowns.换号>Date.now()?'disabled':''}>换号${State.safetyCooldowns.换号>Date.now()?'('+fmtCooldown(State.safetyCooldowns.换号)+')':''}</button><button class="btn-secondary" onclick="updateStat('exposure',-8);renderStalkerTab('safety');">报警</button>`;}}
function renderAlts(){renderPage('page-app-alts',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="altBack">← 小号</button></div><div class="content-area">${[{n:'小号A',risk:30},{n:'小号B',risk:5},{n:'小号C',risk:70}].map(a=>`<div class="card"><b>${a.n}</b><br><div class="progress-bar"><div class="progress-fill" style="width:${a.risk}%;background:${a.risk>50?'var(--danger)':'var(--success)'};"></div></div>${a.risk}%<br><button class="btn-sm" onclick="if(${a.risk}>50&&Math.random()<0.3){pushNotification('⚠️小号被扒','','');updateStat('exposure',15);}alert('已切换')">切换</button></div>`).join('')}</div>`);navigateTo('page-app-alts');$('altBack').onclick=renderHome;}
function renderEmotion(){const svgSize=120;const r=50;const circ=2*Math.PI*r;const off=circ-(State.emotion/100)*circ;renderPage('page-app-emotion',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="emoBack">← 情绪</button></div><div class="content-area" style="text-align:center;"><svg width="${svgSize}" height="${svgSize}"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bar-bg)" stroke-width="8"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bar-emotion)" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 60 60)" style="transition:0.5s"/><text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="var(--text-primary)">${State.emotion}</text></svg><p>${State.emotion>80?'😊':State.emotion<30?'😢':'😐'}</p>${['和他聊天','找闺蜜'].map((l,i)=>`<button class="btn-secondary" onclick="updateStat('emotion',${Object.values(G.emotionRecover)[i]})">${l}+${Object.values(G.emotionRecover)[i]}</button>`).join('')}<button class="btn-sm" style="margin-top:8px;" onclick="window._showEmotionDiary()">📓情绪日记</button></div>`);navigateTo('page-app-emotion');$('emoBack').onclick=renderHome;}
window._showEmotionDiary=()=>{const entries=State.emotionDiary.length?State.emotionDiary.slice(-10).reverse().map(e=>`<div class="card"><b>${e.date}</b> ${e.value}<br>${e.note||''}</div>`).join(''):'<p>暂无</p>';const overlay=showModal(`<div class="modal-box"><h4>📓情绪日记</h4>${entries}<div style="display:flex;gap:5px;margin-top:8px;"><input id="diaryNote_${State._modalCount}" placeholder="记录..."><button class="btn-primary" id="diarySave_${State._modalCount}" style="width:auto;">保存</button></div><button class="btn-sm" id="diaryClose_${State._modalCount}" style="margin-top:8px;">关闭</button></div>`);overlay.querySelector(`#diaryClose_${State._modalCount}`).onclick=()=>overlay.remove();overlay.querySelector(`#diarySave_${State._modalCount}`).onclick=()=>{const note=overlay.querySelector(`#diaryNote_${State._modalCount}`)?.value||'';State.emotionDiary.push({date:new Date().toLocaleDateString(),value:State.emotion,note});overlay.remove();};};
function renderSettings(){renderPage('page-app-settings',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="setBack">← 设置</button></div><div class="content-area"><div class="section-title">通用</div><div class="card" onclick="window._chDiff()">📊${State.difficulty}/${State.rhythm}</div><div class="card" onclick="State.autoSave=!State.autoSave;renderSettings();">💾自动存档：${State.autoSave?'开':'关'}</div><div class="section-title">安全</div><div class="card" onclick="const p=prompt('新密码：');if(p?.length===4){State.hisPhonePassword=p;renderSettings();}">🔑密码：${State.hisPhonePassword}</div><div class="section-title">数据</div><div class="card" onclick="window._showAch()">🏆成就</div><div class="card" onclick="window._showSave()">💾存档</div></div>`);navigateTo('page-app-settings');$('setBack').onclick=renderHome;}
window._chDiff=()=>{const d=prompt('难度：普通/困难/地狱');if(['普通','困难','地狱'].includes(d))State.difficulty=d;renderSettings();};
window._showAch=()=>{renderPage('page-app-ach',`<div class="title-bar"><button class="back-btn" id="achBack">← 成就</button></div><div class="content-area">${G.achievementList.map(a=>`<div style="padding:6px 0;${State.achievements[a.id]?'color:var(--accent);':'opacity:0.4;'}"><b>${a.tier}</b> ${a.name} ${State.achievements[a.id]?'✅':''}</div>`).join('')}</div>`);navigateTo('page-app-ach');$('achBack').onclick=renderSettings;};
window._showSave=()=>{renderPage('page-app-save',`<div class="title-bar"><button class="back-btn" id="saveBack">← 存档</button></div><div class="content-area">${[0,1,2].map(i=>`<div class="card"><b>槽${i+1}</b>${State.saveSlots[i]?`<br>阶段${State.saveSlots[i].phase}<br><button class="btn-sm" id="load-${i}">读</button><button class="btn-sm" style="color:var(--danger);" id="del-${i}">删</button>`:`<br>空<br><button class="btn-sm btn-primary" id="save-${i}">保存</button>`}</div>`).join('')}</div>`);navigateTo('page-app-save');$('saveBack').onclick=renderSettings;[0,1,2].forEach(i=>{if(State.saveSlots[i]){$('load-'+i).onclick=()=>{const s=State.saveSlots[i];State.publicOpinion=s.op;State.relationship=s.rel;State.exposure=s.exp;State.phase=s.phase;State.countdown=s.cd;if(State.countdown&&State.phase===3)startCountdown();renderHome();};$('del-'+i).onclick=()=>{State.saveSlots[i]=null;window._showSave();};}else{$('save-'+i).onclick=()=>{State.saveSlots[i]={op:State.publicOpinion,rel:State.relationship,exp:State.exposure,phase:State.phase,cd:State.countdown};window._showSave();};}});};
function renderAlbum(){renderPage('page-app-album',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="albBack">← 相册</button></div><div class="content-area"><div style="font-size:48px;text-align:center;">🔒</div><p style="text-align:center;">加密相册</p><div class="card">📁合照(23)</div><div class="card">📁偷拍(47)</div></div>`);navigateTo('page-app-album');$('albBack').onclick=renderHome;}
function renderCalendar(){const now=new Date();const y=now.getFullYear();const m=now.getMonth();const dim=new Date(y,m+1,0).getDate();const fd=new Date(y,m,1).getDay();let h='<div class="grid-7">';['日','一','二','三','四','五','六'].forEach(d=>h+=`<div style="text-align:center;font-size:10px;">${d}</div>`);for(let i=0;i<fd;i++)h+='<div></div>';for(let d=1;d<=dim;d++)h+=`<div class="calendar-day${d===now.getDate()?' today':''}">${d}</div>`;h+='</div>';renderPage('page-app-calendar',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="calBack">← 日历</button></div><div class="content-area"><p style="text-align:center;font-weight:700;">${y}年${m+1}月</p>${h}<div class="chat-bubble theirs highlight">💕纪念日：${new Date(State.anniversaryDate).toLocaleDateString('zh-CN')}</div></div>`);navigateTo('page-app-calendar');$('calBack').onclick=renderHome;}
function renderBulletin(){renderPage('page-app-notice',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="bulBack">← 公告板</button></div><div class="content-area"><div class="card" onclick="alert('所有行程保密')">📢安保通知</div><div class="card" onclick="alert('统一口径：朋友聚会')">📝公关策略</div>${State.phase>=3?'<div class="card" style="border-color:var(--danger);">🚨媒体问询函</div>':''}</div>`);navigateTo('page-app-notice');$('bulBack').onclick=renderHome;}
function renderMemo(){renderPage('page-app-memo',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="memoBack">← 备忘录</button></div><div class="content-area">${State.hisMemos.map((m,i)=>`<div class="chat-bubble theirs" style="display:flex;justify-content:space-between;"><span>${m}</span><button class="btn-sm" style="color:var(--danger);" onclick="State.hisMemos.splice(${i},1);renderMemo();">删</button></div>`).join('')}<div style="display:flex;gap:5px;"><input id="newMemo" placeholder="新建..."><button class="btn-primary" id="addMemo" style="width:auto;">+</button></div></div>`);navigateTo('page-app-memo');$('memoBack').onclick=renderHome;$('addMemo').onclick=()=>{const i=$('newMemo');if(i?.value.trim()){State.hisMemos.push(i.value.trim());i.value='';renderMemo();}};}
function renderBestie(){renderPage('page-app-bestie',`<div class="status-bar"><span>📶WiFi</span><span class="time">${fmtTime()}</span><span>🔋85%</span></div><div class="title-bar"><button class="back-btn" id="bstBack">← 闺蜜群</button></div><div class="content-area"><div id="bstChat" style="max-height:280px;overflow-y:auto;">${(State.chatHistory.bestie||[]).slice(-10).map(m=>`<div class="chat-row"><div class="chat-avatar">${m.avatar||'👩‍🦰'}</div><div class="chat-bubble theirs"><b>${m.user}:</b> ${m.text}</div></div>`).join('')}</div><div style="display:flex;gap:5px;"><input id="bstInput" placeholder="倾诉..."><button class="btn-primary" id="bstSend" style="width:auto;">发</button></div></div>`);navigateTo('page-app-bestie');$('bstBack').onclick=renderHome;$('bstSend').onclick=()=>{const i=$('bstInput');if(!i?.value.trim())return;State.chatHistory.bestie.push({user:'我',text:i.value.trim(),avatar:'👩'});i.value='';updateStat('emotion',G.emotionRecover.bestie);renderBestie();};}

// ==================== 定时器 ====================
function startAllTimers(){clearAllTimers();State.timers.phase=setInterval(checkPhase,300000);State.timers.stalker=setInterval(()=>{const freq=G.stalkerBaseFrequency*(1+State.exposure/10*G.stalkerExposureMultiplier)*(State.phase===2?1.5:State.phase===3?2:1);if(Math.random()<0.05*freq){const types=[];if(State.exposure>10)types.push({type:'📧私信',level:'🟡',desc:'微博私信威胁'});if(State.exposure>20)types.push({type:'📞电话',level:'🟠',desc:'陌生号码3次'});if(types.length){const e=types[Math.floor(Math.random()*types.length)];State.stalkerEvents.push({...e,time:new Date().toLocaleString()});if(e.type==='📞电话'&&Math.random()<0.3)showIncomingCall('陌生号码',true);}}},60000);State.timers.fan=setInterval(()=>{if(State.myFanGroupType!=='none'){const fans=['@小透明','@守护者'];State.myFanchatMessages.push({user:fans[Math.floor(Math.random()*fans.length)],text:['好帅！','何时播'][Math.floor(Math.random()*2)],avatar:'👤'});if(State.myFanchatMessages.length>100)State.myFanchatMessages=State.myFanchatMessages.slice(-50);}},10000);State.timers.maleFan=setInterval(()=>{const fans=['@姐姐独美','@小透明'];State.maleFanchatMessages.push({user:fans[Math.floor(Math.random()*fans.length)],text:['好帅！','新剧'][Math.floor(Math.random()*2)],avatar:'👤'});},5000);State.timers.super=setInterval(()=>{const c=G.supertopicPostMinCount+Math.floor(Math.random()*(G.supertopicPostMaxCount-G.supertopicPostMinCount+1));for(let i=0;i<c;i++){State.supertopicPosts.push({user:'@粉丝'+Math.floor(Math.random()*1000),text:'新图好美！',time:fmtTime(),likes:0});State.hisSupertopicPosts.push({user:'@砚台'+Math.floor(Math.random()*1000),text:'哥哥好帅',time:fmtTime()});}if(State.supertopicPosts.length>200)State.supertopicPosts=State.supertopicPosts.slice(-200);},120000);State.timers.growth=setInterval(()=>{if(State.myFanGroupType!=='none')State.myFanGroupOnline=Math.min(G.fanGroupConfig[State.myFanGroupType].onlineMax,State.myFanGroupOnline+G.fanGroupConfig[State.myFanGroupType].growthRate/24);State.maleFanGroupOnline=Math.min(G.maleFanGroup.onlineMax,State.maleFanGroupOnline+G.maleFanGroup.growthRate/24);},G.fanGroupGrowthInterval);State.timers.hot=setInterval(refreshHotSearch,G.hotSearchRefreshInterval);State.timers.auto=setInterval(()=>{if(State.autoSave)saveGame();},600000);State.timers.ann=setInterval(checkAnniversary,3600000);State.timers.male=setInterval(maleActiveMessage,600000);}

function init(){if(!loadGame()){renderSplash();}else{renderHome();startAllTimers();}}
init();
})();
</script>
