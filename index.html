<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>嫂嫂模拟器 v3.2.1</title>
  <style>
    :root {
      --bg: #0c0c10;
      --surface: #181820;
      --gold: #b49450;
      --gold-light: #d4b860;
      --text: #e0d7b0;
      --text-secondary: #a09c8c;
      --danger: #c96b6b;
      --success: #7bc97b;
      --warning: #c9a63b;
      --border: #2e2e36;
      --radius: 12px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    body {
      background: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      background-image: radial-gradient(ellipse at 50% 50%, #1a1a20 0%, #050508 70%);
    }
    .phone-frame {
      background: linear-gradient(160deg, #2a2a30, #18181e);
      border-radius: 40px;
      padding: 10px 7px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.9), inset 0 0 6px rgba(180, 148, 80, 0.2), 0 0 0 2px #1a1a20;
      position: relative;
      transition: transform 0.1s;
    }
    .phone-notch {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 22px;
      background: #08080c;
      border-radius: 0 0 16px 16px;
      z-index: 10;
    }
    .phone-screen {
      width: 390px;
      height: 760px;
      background: var(--bg);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #252530;
      position: relative;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
    }
    .status-bar {
      background: #0a0a10;
      color: var(--gold-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 5px;
      font-size: 10px;
      font-weight: 500;
      border-bottom: 1px solid #1a1a24;
      z-index: 4;
      letter-spacing: 0.5px;
    }
    .app-content {
      flex: 1;
      background: var(--bg);
      overflow-y: auto;
      padding: 8px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) #1a1a22;
      color: var(--text);
      -webkit-overflow-scrolling: touch;
    }
    .app-content::-webkit-scrollbar {
      width: 2px;
    }
    .app-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .app-content::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 2px;
    }
    .bottom-nav {
      background: #0e0e16;
      display: flex;
      justify-content: space-around;
      padding: 5px 10px 8px;
      border-top: 1px solid #1a1a24;
    }
    .nav-item {
      font-size: 20px;
      color: #444;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .nav-item.active {
      color: var(--gold-light);
      background: rgba(180, 148, 80, 0.08);
    }
    .grid-icons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px 0;
      padding: 8px 0;
      text-align: center;
    }
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: 0.12s;
      padding: 3px 0;
    }
    .app-icon:active {
      transform: scale(0.88);
      filter: brightness(1.2);
    }
    .icon-bg {
      background: #16161e;
      width: 50px;
      height: 50px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 3px;
      border: 1px solid #252530;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      transition: 0.15s;
    }
    .app-icon:hover .icon-bg {
      border-color: var(--gold);
    }
    .app-icon .label {
      color: #a0a0a8;
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    button {
      background: #1c1c26;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      margin: 2px;
      font-size: 10.5px;
      transition: all 0.15s;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    button:active {
      transform: scale(0.95);
      filter: brightness(1.3);
    }
    button.gold {
      background: linear-gradient(180deg, #c9a63b, #8a6a2a);
      color: #08080c;
      border: none;
      font-weight: 700;
    }
    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    input,
    textarea {
      background: #12121a;
      border: 1px solid #252530;
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--text);
      width: 100%;
      margin: 2px 0;
      outline: none;
      font-size: 11px;
      transition: 0.15s;
    }
    input:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 6px rgba(180, 148, 80, 0.15);
    }
    .chat-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 5px 0;
      animation: fadeIn 0.2s ease;
    }
    .chat-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1a1a24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      border: 1px solid #2a2a34;
    }
    .chat-bubble {
      background: #16161e;
      border-radius: 10px;
      padding: 7px 10px;
      max-width: 78%;
      font-size: 11px;
      line-height: 1.4;
      word-break: break-word;
      border: 1px solid #202028;
    }
    .chat-bubble.right {
      background: #182018;
      border-right: 2px solid var(--gold);
      margin-left: auto;
    }
    .chat-bubble.highlight {
      border-left: 3px solid var(--warning);
      background: #1a1a26;
    }
    .notif-bar {
      background: #14141c;
      border-left: 4px solid var(--warning);
      padding: 8px 10px;
      margin: 4px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .progress-bar {
      height: 4px;
      background: #1a1a24;
      border-radius: 2px;
      overflow: hidden;
      margin: 2px 0 5px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7a5a20, var(--gold-light));
      transition: width 0.4s ease;
      border-radius: 2px;
    }
    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 8px;
      background: #1a1a24;
      margin: 1px;
      font-weight: 500;
    }
    .tag.red {
      background: #201010;
      color: var(--danger);
      border: 1px solid #3a1a1a;
    }
    .tag.green {
      background: #102010;
      color: var(--success);
      border: 1px solid #1a3a1a;
    }
    .tag.yellow {
      background: #202010;
      color: #c9c97b;
      border: 1px solid #3a3a1a;
    }
    .tag.gold {
      background: #201a10;
      color: var(--gold-light);
      border: 1px solid #3a2a1a;
    }
    .dlc-card {
      background: #12121a;
      border: 1px solid #202028;
      border-radius: 10px;
      padding: 10px;
      margin: 5px 0;
      transition: 0.15s;
    }
    .dlc-card.locked {
      opacity: 0.35;
      pointer-events: none;
    }
    .dlc-card.active {
      border-color: var(--success);
      background: #0e1a12;
    }
    .achievement-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      border-bottom: 1px solid #14141c;
      font-size: 10px;
    }
    .achievement-row.unlocked {
      color: var(--gold-light);
    }
    .achievement-row.locked {
      opacity: 0.4;
    }
    .countdown-bar {
      background: #12121a;
      border-radius: 6px;
      padding: 5px 8px;
      margin: 3px 0 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      border: 1px solid #2a1a1a;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin: 6px 0;
    }
    .photo-item {
      aspect-ratio: 1;
      background: #14141c;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 1px solid #202028;
      cursor: pointer;
      transition: 0.15s;
    }
    .photo-item:active {
      border-color: var(--gold);
      transform: scale(0.95);
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in {
      animation: fadeIn 0.25s ease;
    }
    .pulse {
      animation: pulse 1.6s infinite;
    }
    .slide-down {
      animation: slideDown 0.3s ease;
    }
    h3,
    h4 {
      color: var(--gold-light);
      margin-bottom: 4px;
      letter-spacing: 0.8px;
      font-size: 14px;
    }
    .text-sm {
      font-size: 9px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
  <script>
    (() => {
      const G = {
        screen: 'splash',
        currentApp: null,
        男主名: '陆砚',
        女主职业: '研究生',
        关系值: 70,
        舆论值: 65,
        暴露度: 30,
        对家关注: 40,
        情绪值: 72,
        他的手机密码: '1024',
        相册密码: '0915',
        错误次数: 0,
        锁定至: null,
        阶段: 1,
        倒计时: 48 * 3600,
        倒计时活跃: false,
        狗仔威胁等级: '🟠',
        狗仔开价: 2000,
        当前小号: '小号A',
        小号昵称: '砚台一小只',
        难度: '普通',
        节奏: '标准',
        教程完成: false,
        通知队列: [],
        粉丝群消息: [],
        闺蜜群消息: [],
        备忘录: ['他怕黑，睡觉必须开小夜灯', '娱八哥开价2000万', '阿Ken说孟瑶整过容'],
        相册照片: [
          { emoji: '💕', desc: '去年生日，他偷偷来学校找你', folder: '合照' },
          { emoji: '🎂', desc: '纪念日那天，在秘密餐厅', folder: '合照' },
          { emoji: '☕', desc: '他在咖啡店等你时的偷拍', folder: '偷拍' },
          { emoji: '📖', desc: '他看剧本时的侧脸', folder: '偷拍' },
          { emoji: '💬', desc: '他发来的第一条微信', folder: '截图' },
          { emoji: '📱', desc: '他微博小号点赞你的截图', folder: '截图' },
        ],
        男主聊天记录: [
          { s: '男主', t: '在干嘛', a: '🧑' },
          { s: '我', t: '在想你', a: '👩' },
          { s: '男主', t: '知道了。……我也想你。别告诉别人我说过这话', a: '🧑' },
        ],
        成就: Object.fromEntries(['人间清醒', '键盘侠克星', '首次热搜', '偷看手机', '潜水高手', '妈妈的认可', '暗号大师', '绿茶终结者', '猪队友立功',
          '反侦察高手', '发现小号', '节奏大师', '嫂学满分', '世纪官宣', '逆风翻盘', '千面人', '铜墙铁壁', '退圈声明', '退圈告白', '全员助攻',
          '双向奔赴'
        ].map(k => [k, false])),
        存档槽: [null, null, null],
        安全冷却: { 换号: 0, 搬家: 0 },
        DLC激活: { '前任归来': false, '退圈倒计时': false },
        定时器: {},
        日历提醒: [],
      };

      const $ = id => document.getElementById(id);
      const render = html => { const el = $('phoneScreen'); if (el) el.innerHTML = html; };
      const quotes = ["藏得住的是恋情，藏不住的是我爱你", "戒指尺寸：9号", "如果退圈：开一家咖啡店，让她当老板", "能瞒多久瞒多久", "她怕冷，空调不要低于26度"];

      // 难度系数
      const diffMul = () => ({ '普通': 1, '困难': 1.5, '地狱': 2.5 } [G.难度] || 1);
      const rhythmMul = () => ({ '舒缓': 2, '标准': 1, '紧凑': 0.5 } [G.节奏] || 1);
      const fmtTime = () => new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const fmtCD = () => {
        const h = Math.floor(Math.max(0, G.倒计时) / 3600),
          m = Math.floor((Math.max(0, G.倒计时) % 3600) / 60),
          s = Math.max(0, G.倒计时) % 60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      };
      const dice = () => Math.floor(Math.random() * 100) + 1;
      const dcCheck = (dc) => {
        const r = dice(),
          adj = Math.min(95, Math.floor(dc * (1 + diffMul() * 0.15)));
        return { r, dc: adj, ok: r <= adj, crit: r <= 5, critFail: r >= 95 };
      };
      const ach = (n) => { if (!G.成就[n]) { G.成就[n] = true;
          setTimeout(() => alert(`🏆 成就：${n}`), 150); } };
      const addNotif = (t, c, i, a) => { G.通知队列.push({ t, c, i, a, id: Date.now() }); if (G.screen === 'desktop')
          showNotif(); };

      function showNotif() {
        if (!G.通知队列.length) return;
        const n = G.通知队列[0],
          ex = document.getElementById('curNotif');
        if (ex) ex.remove();
        const el = document.createElement('div');
        el.id = 'curNotif';
        el.className = 'notif-bar slide-down';
        el.style.cssText = 'position:absolute;top:42px;left:5px;right:5px;z-index:20;';
        el.innerHTML =
          `<span style="font-size:20px;">${n.i}</span><div style="flex:1;"><b>${n.t}</b><div class="text-sm">${n.c}</div></div><button onclick="window._dismissN()" style="padding:2px 6px;font-size:9px;">忽略</button><button onclick="window._viewN('${n.a}')" class="gold" style="padding:2px 6px;font-size:9px;">查看</button>`;
        $('phoneScreen').appendChild(el);
      }
      window._dismissN = () => { G.通知队列.shift();
        document.getElementById('curNotif')?.remove();
        setTimeout(showNotif, 250); };
      window._viewN = (a) => { G.通知队列.shift();
        document.getElementById('curNotif')?.remove(); const acts = { hisPhone: 'hisPhone', weibo: 'weibo', wechat: 'wechat',
          paparazzi: 'paparazzi', calendar: 'calendar', mood: 'mood', incoming: 'incoming' }; if (acts[a]) openApp(acts[
          a]); };

      function checkPhase() {
        if (G.阶段 === 1 && G.暴露度 >= 40 && G.舆论值 <= 55) { G.阶段 = 2;
          alert('⚠️ 阶段推进：危机逼近');
          addNotif('⚠️ 危机逼近', '赵姐让你少出门', '⚠️', 'wechat'); }
        if (G.阶段 === 2 && G.暴露度 >= 60 && !G.倒计时活跃) { G.倒计时活跃 = true;
          G.阶段 = 3;
          alert('🚨 48小时倒计时启动');
          addNotif('🚨 倒计时', '娱八哥开价2000万', '⏰', 'paparazzi'); }
      }

      // 新手引导
      function tutorial() {
        if (G.教程完成) return;
        const steps = [
          { t: '欢迎', c: '你是顶流男星的圈外女友。保持低调，管理好舆论和关系。', b: '下一步' },
          { t: '📱 他的手机', c: `点击"他的手机"图标，输入密码（默认1024）查看${G.男主名}的手机。`, b: '知道了' },
          { t: '⚠️ 暴露度', c: '在粉丝群发言、悄悄见面都会增加暴露度。暴露度过高触发危机。', b: '明白了' },
          { t: '💙 情绪', c: '情绪过低无法聊天。通过和他聊天或找闺蜜倾诉恢复。', b: '开始' },
        ];
        let s = 0;

        function show() {
          const st = steps[s];
          const ov = document.createElement('div');
          ov.className = 'slide-down';
          ov.style.cssText =
            'position:absolute;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;border-radius:32px;padding:25px;text-align:center;';
          ov.innerHTML =
            `<div style="font-size:36px;">📖</div><h3 style="color:var(--gold-light);">${st.t}</h3><p style="margin:10px 0;font-size:12px;line-height:1.5;">${st.c}</p><button id="tutBtn" class="gold">${st.b}</button><button id="tutSkip" style="font-size:9px;opacity:0.5;">跳过</button>`;
          $('phoneScreen').appendChild(ov);
          document.getElementById('tutBtn').onclick = () => { ov.remove();
            s++; if (s < steps.length) show();
            else { G.教程完成 = true; } };
          document.getElementById('tutSkip').onclick = () => { ov.remove();
            G.教程完成 = true; };
        }
        show();
      }

      // ==================== 启动/创建 ====================
      function splash() {
        render(
          `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#06060c;color:var(--gold-light);text-align:center;"><div style="font-size:36px;font-weight:bold;letter-spacing:4px;">嫂嫂模拟器</div><div class="text-sm" style="margin:4px;">v3.2.1</div><div style="margin:18px;width:28px;height:28px;border:3px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;"></div><div style="color:var(--text-secondary);font-style:italic;">"${quotes[Math.floor(Math.random()*quotes.length)]}"</div></div>`
          );
        setTimeout(() => { G.screen = 'create1';
          create1(); }, 2000);
      }

      function create1() {
        render(
          `<div class="app-content"><h3>创建男主角</h3><button onclick="window._defMale()">📋默认</button><input placeholder="姓名" value="陆砚" id="mName"><input placeholder="年龄" value="27"><input placeholder="职业" value="顶流男演员"><input placeholder="人设" value="清冷矜贵"><input placeholder="真实性格" value="毒舌占有欲强"><input placeholder="软肋" value="怕黑"><input placeholder="粉丝数" value="8000万"><button onclick="window._goC2()" class="gold" style="width:100%;">下一步→</button></div>`
          );
      }
      window._defMale = () => { const e = document.getElementById('mName'); if (e) e.value = '陆砚'; };
      window._goC2 = () => { G.男主名 = document.getElementById('mName')?.value || '陆砚';
        create2(); };

      function create2() {
        render(
          `<div class="app-content"><h3>创建身份</h3><div style="display:flex;flex-wrap:wrap;gap:3px;">${['广告AE','研究生','咖啡店老板','小演员','对家公司','医生'].map(r=>`<button onclick="window._setR('${r}')">${r}</button>`).join('')}</div><input placeholder="职业" value="研究生" id="rJob"><input placeholder="描述" value="秘密恋爱一年半" id="rDesc"><input placeholder="舆论修正" value="0" type="number" id="oMod"><input placeholder="初始关系值" value="70" type="number" id="rInit"><button onclick="window._confirmR()" class="gold" style="width:100%;">进入游戏</button></div>`
          );
      }
      window._setR = (r) => { const e = document.getElementById('rJob'); if (e) e.value = r; };
      window._confirmR = () => {
        G.女主职业 = document.getElementById('rJob')?.value || '研究生';
        G.关系值 = Math.max(0, Math.min(100, parseInt(document.getElementById('rInit')?.value) || 70));

      function monitor() {
        render(
          `<div class="app-content"><h4>📊舆情</h4>${[['💚舆论',G.舆论值],['❤️关系',G.关系值],['⚠️对家',G.对家关注],['👁️暴露',G.暴露度]].map(([l,v])=>`<p>${l}${v}/100</p><div class="progress-bar"><div class="progress-fill" style="width:${v}%"></div></div>`).join('')}<p class="text-sm">阶段${G.阶段}|难度${G.难度}</p><button onclick="desktop()">←</button></div>`
          );
      }

      function harass() {
        render(
          `<div class="app-content"><h4>🚨骚扰</h4><div class="chat-bubble">📞陌生3次<span class="tag red">高危</span></div><button onclick="window._safe('换号')" ${G.安全冷却.换号>Date.now()?'disabled':''}>换号${G.安全冷却.换号>Date.now()?'(冷却)':''}</button><button onclick="window._safe('报警')">报警</button><button onclick="window._safe('搬家')" ${G.安全冷却.搬家>Date.now()?'disabled':''}>搬家${G.安全冷却.搬家>Date.now()?'(冷却)':''}</button><button onclick="desktop()">←</button></div>`
          );
      }
      window._safe = (t) => { if (t === '换号') { G.安全冷却.换号 = Date.now() + 7 * 86400000;
          G.暴露度 = Math.max(0, G.暴露度 - 18); } else if (t === '报警') G.暴露度 = Math.max(0, G.暴露度 - 8);
        else { G.安全冷却.搬家 = Date.now() + 30 * 86400000;
          G.暴露度 = Math.max(0, G.暴露度 - 28); }
        checkPhase();
        harass(); };

      // ==================== 闺蜜/小号/情绪 ====================
      function bestie() {
        render(
          `<div class="app-content" id="bst"><h4>👯闺蜜群</h4><div id="bstChat" style="max-height:240px;overflow-y:auto;">${G.闺蜜群消息.slice(-8).map(m=>`<div class="chat-row"><div class="chat-avatar">${m.a}</div><div class="chat-bubble"><b>${m.u}:</b> ${m.t}</div></div>`).join('')}</div><div style="display:flex;gap:3px;"><input placeholder="倾诉..." id="bstIn"><button onclick="window._bstSend()">发</button></div><button onclick="desktop()">←</button></div>`
          );
        setTimeout(() => { const c = document.getElementById('bstChat'); if (c) c.scrollTop = c.scrollHeight; }, 80);
      }
      window._bstSend = () => { const i = document.getElementById('bstIn'); if (!i?.value.trim()) return;
        G.闺蜜群消息.push({ u: '我', t: i.value.trim(), a: '👩' });
        i.value = '';
        G.情绪值 = Math.min(100, G.情绪值 + 5);
        bestie();
        setTimeout(() => { G.闺蜜群消息.push({ u: '闺蜜A', t: ['抱抱','会好的','需要帮忙吗'][Math.floor(Math.random()*3)], a: '👩‍🦰' });
          bestie(); }, 1800); if (!dcCheck(75).ok) { G.暴露度 = Math.min(100, G.暴露度 + 2);
          checkPhase(); } };

      function smurf() {
        const ac = [{ n: '小号A', nick: G.小号昵称, u: '粉丝群', r: '🟡', c: 'yellow' }, { n: '小号B', nick: '网友', u: '社交', r: '🟢',
          c: 'green' }, { n: '小号C', nick: '匿名', u: '爆料', r: '🔴', c: 'red' }
        ];
        render(
          `<div class="app-content"><h4>👤小号</h4><p>当前：<b>${G.当前小号}</b></p>${ac.map(a=>`<div class="chat-bubble" style="display:flex;justify-content:space-between;"><div><b>${a.n}</b>${a.nick}<br><span class="text-sm">${a.u}</span></div><span class="tag ${a.c}">${a.r}</span>${G.当前小号===a.n?'<span class="tag green">当前</span>':`<button onclick="window._swSmurf('${a.n}')">切</button>`}</div>`).join('')}<button onclick="desktop()">←</button></div>`
          );
      }
      window._swSmurf = (n) => { G.当前小号 = n; if (n === '小号A') G.小号昵称 = '砚台一小只'; else if (n === '小号B') G.小号昵称 =
          '普通网友';
        else G.小号昵称 = '匿名爆料者'; if (n === '小号C' && !dcCheck(55).ok) { G.暴露度 = Math.min(100, G.暴露度 + 12 * diffMul());
          checkPhase(); }
        alert('已切换');
        smurf(); };

      function mood() {
        render(
          `<div class="app-content"><h4>💙情绪</h4><p>${G.情绪值}/100</p><div class="progress-bar"><div class="progress-fill" style="width:${G.情绪值}%"></div></div><p class="text-sm">${G.情绪值>80?'🔴冲动':G.情绪值<30?'🔵受限':'🟢平稳'}</p><button onclick="G.情绪值=Math.min(100,G.情绪值+15);mood()">💬+15</button><button onclick="G.情绪值=Math.min(100,G.情绪值+10);mood()">👯+10</button><button onclick="desktop()">←</button></div>`
          );
      }

      // ==================== 设置 ====================
      function settings() {
        const u = Object.values(G.成就).filter(v => v).length;
        render(
          `<div class="app-content"><h4>⚙️设置</h4><div class="chat-bubble" onclick="window._chPwd()">🔑密码${'●'.repeat(G.他的手机密码.length)}</div><div class="chat-bubble" onclick="window._chDiff()">📊难度${G.难度}|节奏${G.节奏}</div><div class="chat-bubble" onclick="window._dlc()">📦DLC<span class="tag">6</span></div><div class="chat-bubble" onclick="window._achv()">🏆成就<span class="tag">${u}/21</span></div><div class="chat-bubble" onclick="window._save()">💾存档</div><p class="text-sm">${G.女主职业}|v3.2.1</p><button onclick="desktop()">←</button></div>`
          );
      }
      window._chPwd = () => { const p = prompt('新4位：'); if (p?.length === 4 && /^\d+$/.test(p)) { G.他的手机密码 = p;
          alert('已更新');
          settings(); } };
      window._chDiff = () => { const d = prompt('难度：普通/困难/地狱'); if (['普通', '困难', '地狱'].includes(d)) G.难度 = d; const r =
          prompt('节奏：舒缓/标准/紧凑'); if (['舒缓', '标准', '紧凑'].includes(r)) G.节奏 = r;
        alert(`难度${G.难度}节奏${G.节奏}`);
        settings(); };
      window._dlc = () => {
        const dl = [{ n: '🤰意外怀孕', l: true, a: false }, { n: '💣对家之女', l: true, a: false }, { n: '📋合约情侣', l: true, a: false },
        { n: '👻前任归来', l: !G.DLC激活['前任归来'], a: G.DLC激活['前任归来'] }, { n: '🕯️退圈倒计时', l: !G.DLC激活['退圈倒计时'], a: G
            .DLC激活['退圈倒计时'] }, { n: '🎭双面人生', l: true, a: false }
        ];
        render(
          `<div class="app-content"><h4>📦DLC</h4>${dl.map(d=>`<div class="dlc-card ${d.a?'active':''} ${d.l?'locked':''}" onclick="${d.l&&!d.a?`window._actDLC('${d.n}')`:''}"><b>${d.n}</b><br><span class="text-sm">${d.a?'✅已激活':d.l?'🔒点击激活':'🔓已解锁'}</span></div>`).join('')}<button onclick="settings()">←</button></div>`
          );
      };
      window._actDLC = (n) => { if (n === '前任归来') { G.DLC激活['前任归来'] = true;
          G.对家关注 += 15; } else { G.DLC激活['退圈倒计时'] = true;
          G.舆论值 = Math.max(0, G.舆论值 - 10); }
        alert(`DLC激活：${n}`);
        window._dlc(); };
      window._achv = () => {
        const tiers = { '🥉': ['人间清醒', '键盘侠克星', '首次热搜', '偷看手机', '潜水高手'], '🥈': ['妈妈的认可', '暗号大师', '绿茶终结者', '猪队友立功',
          '反侦察高手', '发现小号', '节奏大师'
        ], '🥇': ['嫂学满分', '世纪官宣', '逆风翻盘', '千面人', '铜墙铁壁', '退圈声明'], '💎': ['退圈告白', '全员助攻', '双向奔赴'] };
        let h = '<div class="app-content"><h4>🏆成就</h4>';
        for (const [t, ns] of Object.entries(tiers)) { h +=
            `<p style="color:var(--gold-light);"><b>${t}</b></p>`;
          ns.forEach(n => h +=
            `<div class="achievement-row ${G.成就[n]?'unlocked':'locked'}"><span>${G.成就[n]?'✅':'🔒'}</span><span>${n}</span></div>`
            ); }
        h += '<button onclick="settings()">←</button></div>';
        render(h);
      };
      window._save = () => {
        render(
          `<div class="app-content"><h4>💾存档</h4>${[0,1,2].map(i=>`<div class="dlc-card"><b>槽${i+1}</b>${G.存档槽[i]?`${G.存档槽[i].ch}<br>舆论${G.存档槽[i].o}关系${G.存档槽[i].r}<br><button onclick="window._ld(${i})">读</button><button onclick="window._delS(${i})" class="danger">删</button>`:`空<br><button onclick="window._sv(${i})" class="gold">保存</button>`}</div>`).join('')}<button onclick="settings()">←</button></div>`
          );
      };
      window._sv = (i) => { G.存档槽[i] = { ch: `阶段${G.阶段}`, o: G.舆论值, r: G.关系值, e: G.暴露度, m: G.情绪值, t: new Date()
          .toLocaleString('zh-CN') };
        alert('已保存');
        window._save(); };
      window._ld = (i) => { if (G.存档槽[i]) { const d = G.存档槽[i];
          G.舆论值 = d.o;
          G.关系值 = d.r;
          G.暴露度 = d.e;
          G.情绪值 = d.m;
          alert('已读取');
          desktop(); } };
      window._delS = (i) => { if (confirm('删除？')) { G.存档槽[i] = null;
          window._save(); } };

      // ==================== 定时器 ====================
      function startTimers() {
        Object.values(G.定时器).forEach(clearInterval);
        G.定时器 = {};
        const fans = ['👑@姐姐独美', '💎@小透明', '🛡️@守护', '🍉@路人', '📈@数据', '📷@站姐', '🧘@佛系', '💕@CP头子', '😞@脱粉'];
        const msgs = ['好帅！', '何时播', '狗仔拍到', '专注自家', '看热搜', '做数据', '照片P的', '不会恋爱', '心情好'];
        G.定时器.f = setInterval(() => { const [a, u] = fans[Math.floor(Math.random() * fans.length)].split('@');
          G.粉丝群消息.push({ u, t: msgs[Math.floor(Math.random() * msgs.length)], a }); if (G.粉丝群消息.length > 50) G.粉丝群消息 =
            G.粉丝群消息.slice(-25); }, (3500 + Math.random() * 3500) * rhythmMul());
        G.定时器.n = setInterval(() => { addNotif(...Object.values([{ t: `${G.男主名}微信`, c: '在干嘛？', i: '💬', a: 'wechat' },
            { t: '娱八哥', c: '考虑好了吗', i: '⚠️', a: 'paparazzi' }, { t: '新照片', c: '相册更新', i: '📱', a: 'hisPhone' }, { t: '陌生来电',
              c: '私生粉', i: '🚨', a: 'incoming' }
          ][Math.floor(Math.random() * 4)])); }, (16000 + Math.random() * 12000) * rhythmMul());
        G.定时器.c = setInterval(() => { if (G.倒计时活跃 && G.倒计时 > 0) { G.倒计时--; if (G.倒计时 <= 0) { G.倒计时活跃 = false;
            G.暴露度 = Math.min(100, G.暴露度 + 18 * diffMul());
            G.舆论值 = Math.max(0, G.舆论值 - 12);
            addNotif('⏰归零', '照片可能曝光', '🚨', 'paparazzi'); } } }, 1000);
        G.定时er.b = setInterval(() => { G.闺蜜群消息.push([{ u: '闺蜜A', t: '他上热搜了', a: '👩‍🦰' }, { u: '闺蜜B', t: '照片什么情况',
            a: '👩‍🦱' }, { u: '闺蜜A', t: '需要帮忙吗', a: '👩‍🦰' }][Math.floor(Math.random() * 3)]); if (G.闺蜜群消息.length >
            25) G.闺蜜群消息 = G.闺蜜群消息.slice(-15); }, (13000 + Math.random() * 9000) * rhythmMul());
        G.定时器.p = setInterval(() => { if (Math.random() < 0.06 * diffMul()) G.暴露度 = Math.min(100, G.暴露度 + Math.floor(
            Math.random() * 2));
          checkPhase(); }, 10000);
      }

      splash();
    })();
  </script>
</body>
</html>
