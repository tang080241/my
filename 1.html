<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>嫂嫂模拟器 v3.2.1 - 娱乐圈模拟</title>
  <style>
    /* ==================== CSS变量 ==================== */
    :root {
      --phone-w: 390px;
      --phone-h: 760px;
      --phone-radius: 28px;
      --phone-bg: #0a0a0d;
      --phone-border: #1e1e24;
      --phone-shadow: 0 0 0 2px #252530, 0 0 0 6px #0f0f14, 0 0 0 8px #252530, 0 20px 60px rgba(0, 0, 0, 0.7);
      --notch-w: 100px;
      --notch-h: 24px;
      --notch-bg: #0f0f14;
      --screen-bg: #0d0d12;
      --status-h: 38px;
      --status-bg: #08080c;
      --status-text: #b0b0b8;
      --status-time: 12px;
      --status-icon: 11px;
      --icon-size: 56px;
      --icon-radius: 14px;
      --icon-bg: #1a1a24;
      --icon-label: 10px;
      --icon-label-color: #9999a6;
      --dock-bg: rgba(255, 255, 255, 0.03);
      --dock-h: 64px;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b0;
      --text-tertiary: #6a6a78;
      --accent: #c9a050;
      --accent-dim: #7a5f30;
      --danger: #d94040;
      --success: #3aac5c;
      --love: #e85d75;
      --border: #1e1e2a;
      --surface: #15151c;
      --bubble-mine: #1a3a2a;
      --bubble-theirs: #1f1f2a;
      --bubble-radius: 16px;
      --bar-bg: rgba(255, 255, 255, 0.06);
      --bar-opinion: #c9a050;
      --bar-relationship: #e85d75;
      --bar-rival: #d94040;
      --bar-exposure: #ff8c42;
      --bar-emotion: #6b9fff;
      --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", "Menlo", "Consolas", "PingFang SC", monospace;
    }

    /* ==================== 基础样式 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      font-family: var(--font-ui);
      overflow: hidden;
    }

    .phone-container {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: var(--phone-radius);
      background: var(--phone-bg);
      box-shadow: var(--phone-shadow);
      overflow: hidden;
      flex-shrink: 0;
    }

    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--notch-w);
      height: var(--notch-h);
      background: var(--notch-bg);
      border-radius: 0 0 16px 16px;
      z-index: 20;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--screen-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .page {
      display: none;
      flex: 1;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-dim) transparent;
    }

    .page.active {
      display: flex;
    }

    .page::-webkit-scrollbar {
      width: 3px;
    }

    .page::-webkit-scrollbar-thumb {
      background: var(--accent-dim);
      border-radius: 3px;
    }

    /* ==================== 状态栏 ==================== */ 
.status-bar {
      height: var(--status-h);
      background: var(--status-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      color: var(--status-text);
      font-size: var(--status-icon);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .status-bar .time {
      font-size: var(--status-time);
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ==================== 标题栏 ==================== */
    .title-bar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }

    .title-bar .back-btn {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 15px;
      cursor: pointer;
    }

    /* ==================== 内容区 ==================== */
    .content-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    /* ==================== 按钮 ==================== */
    button {
      font-family: var(--font-ui);
      cursor: pointer;
      transition: all 0.15s;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .btn-secondary {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
    }

    .btn-sm {
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* ==================== 输入框 ==================== */
    input,
    select,
    textarea {
      width: 100%;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0 14px;
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }

    input,
    select {
      height: 42px;
    }

    textarea {
      height: 80px;
      padding: 10px 14px;
      resize: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    /* ==================== 标签 ==================== */
    label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 16px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ==================== 进度条 ==================== */
    .progress-bar {
      height: 6px;
      background: var(--bar-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* ==================== 聊天气泡 ==================== */
    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: var(--bubble-radius);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      margin: 4px 0;
    }

    .chat-bubble.mine {
      background: var(--bubble-mine);
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      margin-left: auto;
    }

    .chat-bubble.theirs {
      background: var(--bubble-theirs);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .chat-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 6px 0;
    }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .chat-avatar-lg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    /* ==================== 标签 ==================== */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      margin: 2px;
    }

    .tag-red {
      background: #3a1010;
      color: var(--danger);
    }

    .tag-green {
      background: #103a10;
      color: var(--success);
    }

    .tag-orange {
      background: #3a2010;
      color: #ff8c42;
    }

    .tag-gold {
      background: #2a2010;
      color: var(--accent);
    }

    /* ==================== 网格 ==================== */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .grid-7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    /* ==================== 卡片 ==================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s;
      margin: 6px 0;
    }

    .card:active {
      transform: scale(0.96);
    }

    /* ==================== App图标 ==================== */
    .icon-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .icon-app:active {
      transform: scale(0.9);
    }

    .icon-app .icon-square {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .icon-app .icon-label {
      font-size: var(--icon-label);
      color: var(--icon-label-color);
      margin-top: 6px;
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==================== Dock栏 ==================== */
   .dock {
      height: var(--dock-h);
      background: var(--dock-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 30px;
      border-radius: 20px 20px 0 0;
      flex-shrink: 0;
    }

    .dock span {
      font-size: 22px;
      color: #666;
      cursor: pointer;
    }

    .dock span.active {
      color: var(--accent);
    }

    /* ==================== 标签栏 ==================== */
    .tab-bar {
      display: flex;
      height: 44px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-bar button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-bar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ==================== 弹窗 ==================== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 25;
      border-radius: 28px;
    }

    .modal-bottom {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.3s ease;
    }

    .modal-overlay-center {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      border-radius: 28px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 20px;
      width: 85%;
      max-height: 70%;
      overflow-y: auto;
    }

    /* ==================== 密码框 ==================== */
    .pwd-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-primary);
      transition: all 0.2s;
    }

    .pwd-box.filled {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    /* ==================== 威胁等级圆环 ==================== */
    .threat-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      font-weight: 700;
    }

    .threat-ring.green {
      border-color: var(--success);
      color: var(--success);
    }

    .threat-ring.yellow {
      border-color: #c9c050;
      color: #c9c050;
    }

    .threat-ring.orange {
      border-color: #ff8c42;
      color: #ff8c42;
    }

    .threat-ring.red {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ==================== 筛选栏 ==================== */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filter-bar button {
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .filter-bar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ==================== 其他组件 ==================== */
    .time-divider {
      text-align: center;
      font-size: 10px;
      color: #555;
      margin: 8px 0;
    }

    .unread-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--danger);
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 10px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      animation: typingBounce 0.6s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .word-cloud span {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .word-cloud span.hot {
      background: var(--danger);
      color: #fff;
      border: none;
      font-weight: 700;
    }

    .word-cloud span.warm {
      color: #ff8c42;
      border-color: #ff8c42;
    }

    .alert-list {
      padding: 0;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    .alert-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border-radius: 50%;
    }

    .calendar-day.today {
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    /* ==================== 动画 ==================== */
@keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-5px);
      }
      75% {
        transform: translateX(5px);
      }
    }

    @keyframes typingBounce {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    .notification-bar {
      position: absolute;
      top: calc(var(--status-h) + 4px);
      left: 8px;
      right: 8px;
      background: #1a1a28;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 15;
      animation: slideIn 0.3s ease;
    }

    .shake {
      animation: shake 0.5s ease;
    }
  </style>
</head>

          Object.assign(State, saved);
          State.countdownTimer = null;
          State.timers = {};
          State.callTimer = null;
          if (State.countdown && State.phase === 3) {
            startCountdown();

          updateAllUI();
          startAllTimers();

      var h = Math.floor(State.countdown / 3600);

      var s = State.countdown % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function fmtCooldown(until) {
      if (!until || Date.now() >= until) return '';
      var minutes = Math.floor((until - Date.now()) / 60000);

      if (minutes > 0) return minutes + 'm';
      return '';

        var freq = G.stalkerBaseFrequency * (1 + State.exposure / 10 * G.stalkerExposureMultiplier) * (State.phase ===
          2 ? 1.5 : State.phase === 3 ? 2 : 1);
        if (Math.random() < 0.05 * freq) {
          var types = [];
          if (State.exposure > 10) types.push({ type: '📧私信', level: '🟡', desc: '微博私信威胁' });
          if (State.exposure > 20) types.push({ type: '📞电话', level: '🟠', desc: '陌生号码3次' });
          if (types.length > 0) {
            var e = types[Math.floor(Math.random() * types.length)];
            State.stalkerEvents.push({ type: e.type, level: e.level, desc: e.desc, time: new Date().toLocaleString() });
            if (e.type === '📞电话' && Math.random() < 0.3) showIncomingCall('陌生号码', true);
          }
        }
      }, 60000);
      State.timers.fan = setInterval(function() {
        if (State.myFanGroupType !== 'none') {
          var fans = ['@小透明', '@守护者'];
          State.myFanchatMessages.push({ user: fans[Math.floor(Math.random() * fans.length)], text: ['好帅！', '何时播'][
            Math.floor(Math.random() * 2)
          ], avatar: '👤' });
          if (State.myFanchatMessages.length > 100) State.myFanchatMessages = State.myFanchatMessages.slice(-50);
        }
      }, 10000);
      State.timers.maleFan = setInterval(function() {
        var fans = ['@姐姐独美', '@小透明'];
        State.maleFanchatMessages.push({ user: fans[Math.floor(Math.random() * fans.length)], text: ['好帅！', '新剧'][
          Math.floor(Math.random() * 2)
        ], avatar: '👤' });
      }, 5000);
      State.timers.super = setInterval(function() {
        var count = G.supertopicPostMinCount + Math.floor(Math.random() * (G.supertopicPostMaxCount - G
